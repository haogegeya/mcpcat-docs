# mkdocs 配置
site_name: MCPCat 文档
site_description: MCP 能力聚合网关官方文档 - 一个 MCP 端点，让 AI Agent 直接拿到实时世界的数据
# 2026-11-03：站点正式上到 GitHub Pages。
# docs.mcpcat.cn 目前 DNS 不解析（NXDOMAIN），canonical 指向死域名会让百度/AI 抓取
# 把权重送给一个打不开的地址，因此先用 Pages 默认域名上线。
# 若改用自建域（路线 B）：把下面改回 https://docs.mcpcat.cn/ ，同时
#   1) 仓库根目录加 CNAME 文件（内容：docs.mcpcat.cn）
#   2) 阿里云 DNS 加 CNAME docs -> haogegeya.github.io.
#   3) Pages 保持 enforces_https，证书由 GitHub 侧自动签发
site_url: https://haogegeya.github.io/mcpcat-docs/
repo_url: https://github.com/haogegeya/mcpcat-docs
repo_name: haogegeya/mcpcat-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到暗黑模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到明亮模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/haogegeya
    - icon: fontawesome/solid/globe
      link: https://mcpcat.cn
  generator: false
  copyright: Copyright © 2026 MCPCat

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 中文标题必须用 unicode slugify，否则默认 slugify 会把中文剥成空串，
      # 导致站内所有中文锚点链接失效（2026-11-03 修复）
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - meta
  - sane_lists

plugins:
  - search:
      lang: zh
  - minify:
      minify_html: true

# 运营/SEO 内部手册只留仓库，不发布到公开文档站：
# 这些文件含本机绝对路径与百度推送流程，公开无价值且会稀释收录质量
exclude_docs: |
  assets/*.md
  seo/**

nav:
  - 首页: index.md
  - 快速开始:
      - 快速开始: getting-started/quickstart.md
      - 认证说明: getting-started/authentication.md
      - 核心概念: getting-started/concepts.md
  - 客户端接入:
      - 总览: guides/README.md
      - Claude Desktop: guides/claude-desktop.md
      - Cursor: guides/cursor.md
      - Cline: guides/cline.md
      - OpenClaw: guides/openclaw.md
      - 其他客户端: guides/other-clients.md
  - API 参考:
      - 总览: api/README.md
      - 认证: api/authentication.md
      - initialize: api/initialize.md
      - tools/list: api/tools-list.md
      - tools/call: api/tools-call.md
      - 错误码: api/error-codes.md
      - 计费规则: api/billing.md
  - 工具列表:
      - 总览: tools/README.md
      - 生活服务: tools/lifestyle.md
      - 物流快递: tools/express.md
      - 通信查询: tools/communication.md
      - 网络工具: tools/network.md
      - 金融行情: tools/finance.md
      - 验证核验: tools/verification.md
      - 出行查询: tools/travel.md
  - 更多:
      - 定价说明: pricing.md
      - 使用示例: examples.md
      - 常见问题: faq.md
      - 路线图: roadmap.md
      - 更新日志: CHANGELOG.md
      - 贡献指南: CONTRIBUTING.md
