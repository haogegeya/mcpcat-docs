name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint
        run: markdownlint '**/*.md' --ignore node_modules --ignore .github

  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lychee
        run: |
          cargo install lychee
          # 或下载预编译版本
          # curl -fsSL https://github.com/lycheeverse/lychee/releases/download/v0.15.0/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz

      - name: Check internal links
        run: lychee --offline 'docs/**/*.md' README.md

  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs
        run: |
          pip install mkdocs mkdocs-material

      - name: Build
        run: mkdocs build --strict
